name: Game rules
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
permissions:
  contents: read
jobs:
  jvm-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common criteria on JVM and JavaScript
        run: ./gradlew :game-core:jvmTest :game-core:jsNodeTest -PuseSystemNode=true
      - name: Build and exercise the JavaScript package
        run: |
          ./gradlew :game-core:jsNodeProductionLibraryDistribution -PuseSystemNode=true
          node game-core/scripts/smoke-js.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the React integration
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @blot/web build
          pnpm --filter @blot/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Save web test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results/
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-core-tests
          path: game-core/build/reports/tests/
